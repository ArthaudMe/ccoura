name: SleepAndCode
options:
  bundleIdPrefix: com.sleepandcode
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  SWIFT_VERSION: "6.0"
  DEVELOPMENT_TEAM: ""
targets:
  SleepAndCode:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Models
      - path: Services
      - path: ViewModels
      - path: Views
      - path: Utilities
    resources:
      - path: Resources/Assets.xcassets
      - path: Resources/Info.plist
        buildPhase: none
    settings:
      INFOPLIST_FILE: Resources/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.sleepandcode.app
      CODE_SIGN_STYLE: Automatic
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_PREVIEWS: true
    entitlements:
      path: Resources/SleepAndCode.entitlements
    info:
      path: Resources/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - sleepandcode
        BGTaskSchedulerPermittedIdentifiers:
          - com.sleepandcode.sync
        UIBackgroundModes:
          - fetch
